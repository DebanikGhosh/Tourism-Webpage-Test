<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Jaipur Tourism - The Pink City</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Mukta:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@600&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Theme Toggle Button -->
    <button id="theme-toggle" class="theme-toggle" title="Toggle Dark/Light Mode">🌙</button>

    <!-- Glassmorphism Sticky Header -->
    <header id="main-header">
        <div class="header-container">
            <div class="logo-title">
                <a href="#home" class="logo-title" style="text-decoration: none;">
                    <div class="logo" aria-hidden="true">J</div>
                    <h1>Jaipur</h1>
                </a>
            </div>
            
            <!-- Hamburger Menu Icon (Mobile Only) -->
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>

            <nav class="tabs" id="nav-tabs">
                <a href="#home" class="tab-link active">Home</a>
                <a href="#heritage" class="tab-link">Heritage</a>
                <a href="#booking" class="tab-link">Hotel Booking</a>
                <a href="#gallery" class="tab-link">Gallery</a>
            </nav>
        </div>
    </header>

    <!-- Main Content with Fade Transition -->
    <main id="app-container" class="fade-in">
        <!-- JS dynamically injects pages here -->
    </main>

    <footer>
        <p class="footer-name">Jaipur <span lang="hi">· जयपुर</span></p><p>Opening hours and fees are approximate; please confirm before you travel. &copy; 2026 Jaipur Tourism.</p>
    </footer>

    <!-- Universal Modal (Used for Gallery Lightbox & Booking Alerts) -->
    <div id="custom-modal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
